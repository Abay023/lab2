<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
<!-- HTML Structure (index.html)
• Viewport Meta Tag: Include <meta name="viewport" content="width=device-width, initial-scale=1.0"> inside
<head>.
• Semantic Elements: Structure your layout using <header>, <main>, <section>, <article>, and <footer>.
• Content Sections: Include a header with navigation, a bio/hero section (<section class="bio-hero">), and a
card container (<section class="card-grid">) housing 3 cards (<article class="card">). -->
    <header class="navbar">
        <div class="logo">LOGO</div>
        <nav>
            <ul class="nav-links">
                <li><a href="#" class="link-text">Home</a></li>
                <li><a href="#" class="link-text">Projects</a></li>
                <li><a href="#" class="link-text">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="bio-hero">
            <h1>BIO HERO SECTION</h1>
        </section>

        <section class="card-grid">
            <article class="card">
                PROJECT CARD 1
            </article>
            <article class="card">
                PROJECT CARD 2
            </article>
            <article class="card">
                PROJECT CARD 3
            </article>
        </section>
        
    </main>

    <footer>
        <p>&copy; 2026 Student Showcase 2.</p>
    </footer>
</body>
</html>
